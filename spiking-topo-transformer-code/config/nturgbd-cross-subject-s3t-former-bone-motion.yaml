# NTU RGB+D 60 X-Sub, bone-motion stream, D=384, T=16
# One of the four streams of the "S3T-Former (D=384, Ens.)" row in Table 1.
# Hyperparameters follow Sec. 4.2 of the paper.

model: model.spiking_ssm_topo_transformer.SpikingStateSpaceTopologyTransformer
model_args:
  num_nodes: 25
  num_person: 2
  in_channels: 3
  num_classes: 60
  embed_dim: 384            # D
  depth: 6                  # L S3T Blocks
  num_heads: 8              # H routing heads
  mlp_ratio: 4.0
  dropout: 0.25             # classifier dropout
  v_threshold: 0.5          # LIF firing threshold U_th
  leak: 0.5                 # LIF leakage factor tau in Eq. (1)
  surrogate_alpha: 2.0      # ATan surrogate shape parameter
  backend: auto             # cupy on CUDA if available, else torch
  topology_gamma: 0.5       # gamma in Eq. (8)
  use_mase: true
  use_temporal_gradient_qkv: true
  atg_alpha_init: 0.8       # initial sigmoid(a) of Soft-ATG
  lstr_mode: hybrid         # hybrid | learned | physical | identity
  use_s3_engine: true
  s3_decay_mode: learnable  # learnable | fixed
  s3_fixed_decay: 0.5
  readout: u_readout        # u_readout | spike_count

feeder: feeders.feeder_ntus.Feeder
train_feeder_args:
  data_path: /path/to/data/NTU60_CS.npz
  split: train
  window_size: 16            # T
  bone: true
  vel: true
  use_mmap: true
test_feeder_args:
  data_path: /path/to/data/NTU60_CS.npz
  split: test
  window_size: 16
  bone: true
  vel: true
  use_mmap: false

num_epoch: 250
batch_size: 64              # total batch size
test_batch_size: 128
base_lr: 0.01               # AdamW
min_lr: 1.0e-5              # end of cosine annealing
warmup_epochs: 10           # linear warmup
weight_decay: 0.0005
betas: [0.9, 0.999]
use_amp: true
max_grad_norm: null
eval_interval: 5
device: [0, 1, 2, 3]        # four GPUs as in the paper; use [0] for a single GPU
num_worker: 8
pin_memory: true
